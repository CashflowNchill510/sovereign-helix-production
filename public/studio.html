<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Idea Studio — Sovereign Helix</title>
  <style>
    :root { --bg:#0b0b10; --card:#14141c; --ink:#eef3ff; --dim:#8b97ad; --gold:#d4af37; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,system-ui,sans-serif; padding:16px 16px 48px; max-width:560px; margin-inline:auto; }
    h1 { font-size:1.2rem; margin:0 0 6px; }
    p, li { color:var(--dim); font-size:.86rem; line-height:1.45; }
    a { color:#7ee0ff; }
    .lane { background:var(--card); border:1px solid #242433; border-radius:14px; padding:12px; margin:10px 0; }
    .lane h2 { font-size:.92rem; margin:0 0 6px; color:var(--gold); }
    label { display:block; font-size:.75rem; color:var(--dim); margin:10px 0 4px; }
    input, select, textarea { width:100%; background:#0e0e16; color:var(--ink); border:1px solid #2a2a3a; border-radius:10px; padding:10px; font:inherit; }
    textarea { min-height:72px; }
    button { width:100%; margin-top:12px; padding:12px; border:0; border-radius:12px; font-weight:700; background:linear-gradient(90deg,#7a6cff,#3dcea0); color:#061016; }
    .out { white-space:pre-wrap; background:#0e0e16; border-radius:12px; padding:12px; font-size:.8rem; color:#d7e4f5; margin-top:12px; }
  </style>
</head>
<body>
  <p><a href="/">← Helix</a></p>
  <h1>IDEA STUDIO</h1>
  <p>Separate lanes. Score one idea per day. Copy the funnel.</p>
  <div class="lane">
    <h2>Lanes (do not merge)</h2>
    <ol>
      <li><b>A ProjectX brief</b></li>
      <li><b>B Demos</b></li>
      <li><b>C Audio pack</b></li>
      <li><b>D Co-builder</b></li>
      <li><b>E Sim only</b></li>
      <li><b>F Archive</b></li>
    </ol>
  </div>
  <div class="lane">
    <h2>Daily audit</h2>
    <label>Today’s idea</label>
    <textarea id="idea" placeholder="One sentence. One buyer."></textarea>
    <label>Lane</label>
    <select id="lane">
      <option>A ProjectX brief</option>
      <option>B Demo HTML</option>
      <option>C Audio pack</option>
      <option>D Co-builder</option>
      <option>E Internal sim</option>
      <option>F Archive only</option>
    </select>
    <label>Stranger can use it this week? (1–5)</label>
    <input id="use" type="number" min="1" max="5" value="3" />
    <label>You can sell it without a lab? (1–5)</label>
    <input id="sell" type="number" min="1" max="5" value="3" />
    <label>Hours to a file someone can open</label>
    <input id="hrs" type="number" min="1" max="80" value="8" />
    <button type="button" id="go">Score + write funnel</button>
    <div class="out" id="out">Run the audit.</div>
  </div>
  <script>
    const FUNNELS = {
      "A ProjectX brief": ["Offer: 2-page card","Price: $19","Page: Gumroad","Traffic: makers"],
      "B Demo HTML": ["Offer: free demo","Price: $0 then $9 add-on","Page: this URL","Traffic: screen record"],
      "C Audio pack": ["Offer: 12 scenes","Price: $12-19","Page: list + clip","Traffic: sleep playlists"],
      "D Co-builder": ["Offer: owner-gated notes","Price: service later","Page: waitlist","Traffic: builders"],
      "E Internal sim": ["Offer: none public","Price: $0","Page: none","Traffic: none"],
      "F Archive only": ["Offer: do not sell zips","Price: --","Page: none","Traffic: none"]
    };
    document.getElementById("go").onclick = () => {
      const idea = document.getElementById("idea").value.trim() || "(no sentence yet)";
      const lane = document.getElementById("lane").value;
      const use = +document.getElementById("use").value;
      const sell = +document.getElementById("sell").value;
      const hrs = +document.getElementById("hrs").value;
      const score = use * 2 + sell * 2 + Math.max(0, 6 - Math.ceil(hrs / 8));
      const verdict = score >= 12 && use >= 4 ? "SHIP this week" : score >= 8 ? "NARROW — one file only" : "PARK in archive";
      const funnel = FUNNELS[lane].map((l,i)=> (i+1)+". "+l).join("\n");
      document.getElementById("out").textContent = verdict+" \u00b7 score "+score+"/16\n\nIdea: "+idea+"\nLane: "+lane+"\n\nFUNNEL\n"+funnel;
    };
  </script>
</body>
</html>
